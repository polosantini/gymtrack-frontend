# Configuración de nginx para la imagen del frontend (issue #42).
# Cumple el mismo papel que el proxy de vite.config.ts, que solo funciona en desarrollo:
# sirve los archivos compilados y reparte /api entre los tres microservicios.
# Las direcciones llegan por variables de entorno (MIEMBROS_URL, CLASES_URL, PAGOS_URL).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # DNS interno de Docker. Resolver los nombres en cada petición, y no al arrancar,
    # permite que nginx levante aunque un servicio esté apagado: necesario para el
    # paso 6 de la demo (Clases y Reservas siguen funcionando sin Pagos).
    resolver 127.0.0.11 ipv6=off valid=10s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # ---------- Miembros, planes y membresías (8081) ----------
    location /api/miembros {
        set $destino "${MIEMBROS_URL}";
        proxy_pass $destino$request_uri;
    }
    location /api/planes {
        set $destino "${MIEMBROS_URL}";
        proxy_pass $destino$request_uri;
    }
    location /api/membresias {
        set $destino "${MIEMBROS_URL}";
        proxy_pass $destino$request_uri;
    }

    # ---------- Clases y reservas (8082) ----------
    location /api/clases {
        set $destino "${CLASES_URL}";
        proxy_pass $destino$request_uri;
    }
    location /api/reservas {
        set $destino "${CLASES_URL}";
        proxy_pass $destino$request_uri;
    }

    # ---------- Pagos y notificaciones (8083) ----------
    location /api/pagos {
        set $destino "${PAGOS_URL}";
        proxy_pass $destino$request_uri;
    }
    location /api/notificaciones {
        set $destino "${PAGOS_URL}";
        proxy_pass $destino$request_uri;
    }

    # Los archivos de dist/assets llevan un hash en el nombre, así que se pueden
    # guardar en caché sin riesgo de servir una versión vieja.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Las rutas (/miembros, /notificaciones...) las maneja React Router en el navegador.
    # Sin esta línea, recargar la página en cualquier ruta devolvería 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
